name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # A cada 20 minutos, fora da hora cheia. As perguntas do torneio ficam
    # abertas por cerca de 3 horas; o bot pula as que já previu.
    - cron: "7,27,47 * * * *"

# Uma execução por vez: a seguinte espera a anterior acabar.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write # só para o passo "Keep the schedule alive"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      # Teto por dia: o arquivo com o gasto de hoje passa de uma execução para a
      # seguinte pelo cache. A chave nova a cada execução existe porque cache não
      # se sobrescreve; a restauração pega a mais recente do dia.
      - name: Day of this run (UTC)
        id: day
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          mkdir -p .gasto
      - name: Restore today's spend
        uses: actions/cache/restore@v4
        with:
          path: .gasto
          key: gasto-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gasto-${{ steps.day.outputs.day }}-
      - name: Start the count if today has none
        run: test -f .gasto/gasto-do-dia.json || echo '{}' > .gasto/gasto-do-dia.json
      - name: Run bot
        run: uv run python main.py
        # Segredos em Settings -> Secrets and variables -> Actions.
        # As variáveis BOT_* são opcionais (aba Variables); vazias, vale o padrão do main.py.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_RESEARCH_MODEL: ${{ vars.BOT_RESEARCH_MODEL }}
          BOT_FORECAST_MODEL: ${{ vars.BOT_FORECAST_MODEL }}
          BOT_MAX_USD_PER_RUN: ${{ vars.BOT_MAX_USD_PER_RUN }}
          BOT_MAX_USD_PER_DAY: ${{ vars.BOT_MAX_USD_PER_DAY }}
      - name: Save today's spend
        if: always() && steps.day.outputs.day != ''
        uses: actions/cache/save@v4
        with:
          path: .gasto
          key: gasto-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the schedule alive
        # Em repositório público o GitHub desliga o agendamento depois de 60 dias
        # sem atividade no repositório. Religar pela API zera essa contagem.
        if: always()
        run: gh api --silent -X PUT "repos/${{ github.repository }}/actions/workflows/run_bot_on_tournament.yaml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
